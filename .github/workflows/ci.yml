name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Check npm tarball contents
        run: npm run pack:check
      - name: Upload build artifact (not a deployment)
        uses: actions/upload-artifact@v6
        with:
          name: gungnir-mcp-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
